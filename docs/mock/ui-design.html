<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin - UI Preview</title>
  <style>
    /* ============================================================
       Simulated Obsidian Environment Variables
       ============================================================ */
    :root {
      /* Obsidian風のベースカラー（ダークテーマ想定） */
      --background-primary: #181a1f;
      --background-secondary: #21252b;
      --text-normal: #dcddde;
      --text-muted: #8b929a;
      
      /* Sin Plugin カスタム変数 */
      --sin-primary: #4ECDC4; /* アクセントカラー（海・波のイメージ） */
      --sin-success-color: #4ECDC4;
      --sin-schedule-color: #FFE66D;
      --sin-streak-color: #FF6B6B;
      
      /* Glassmorphism 変数 */
      --sin-glass-bg: color-mix(in srgb, var(--background-primary) 60%, transparent);
      --sin-glass-border: color-mix(in srgb, var(--text-normal) 10%, transparent);
      --sin-glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      
      --sin-radius: 16px; 
      --sin-radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--background-primary);
      color: var(--text-normal);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* ============================================================
       Wave View Container & Canvas
       ============================================================ */
    .sin-wave-view {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }

    .sin-wave-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       Main Layout & Glassmorphism
       ============================================================ */
    .sin-content {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Tab Bar */
    .sin-tab-bar {
      display: flex;
      gap: 8px;
      padding: 6px;
      background: var(--sin-glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid var(--sin-glass-border);
      width: fit-content;
      margin: 0 auto;
    }

    .sin-tab-btn {
      padding: 8px 16px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sin-tab-btn--active {
      background: var(--sin-primary);
      color: #181a1f;
    }

    /* Glass Section */
    .sin-section {
      background: var(--sin-glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--sin-glass-border);
      border-radius: var(--sin-radius);
      box-shadow: var(--sin-glass-shadow);
      padding: 24px;
    }

    .sin-date-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      font-size: 1.1em;
      font-weight: bold;
    }

    .sin-today-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 600px) {
      .sin-today-grid { grid-template-columns: 1fr; }
    }

    .sin-subsection-title {
      font-size: 0.85em;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--sin-glass-border);
      padding-bottom: 8px;
    }

    /* ============================================================
       Items (Habits & Schedules)
       ============================================================ */
    .sin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sin-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: color-mix(in srgb, var(--background-secondary) 50%, transparent);
      border: 1px solid var(--sin-glass-border);
      border-radius: var(--sin-radius-sm);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      user-select: none;
    }

    .sin-item:hover {
      transform: translateY(-3px) scale(1.01);
      background: color-mix(in srgb, var(--background-secondary) 80%, transparent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border-color: color-mix(in srgb, var(--sin-primary) 40%, transparent);
    }

    /* Checkbox & Animations */
    .sin-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--text-normal) 30%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sin-item--done { opacity: 0.6; }
    .sin-item--done .sin-checkbox {
      border-color: var(--sin-success-color);
      background: var(--sin-success-color);
      animation: sin-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes sin-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .sin-checkbox-check {
      color: #181a1f;
      font-weight: bold;
      font-size: 0.9em;
      display: none;
    }
    
    .sin-item--done .sin-checkbox-check {
      display: block;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      animation: sin-draw-check 0.3s 0.1s forwards ease-out;
    }

    .sin-item--done .sin-name { text-decoration: line-through; }

    .sin-name { flex: 1; font-size: 0.95em; }
    .sin-streak { font-size: 0.8em; color: var(--sin-streak-color); font-weight: bold; }
    .sin-time { font-size: 0.85em; color: var(--sin-schedule-color); font-weight: bold; }

    /* Ripple Effect */
    .sin-ripple {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--sin-success-color) 40%, transparent) 0%, transparent 70%);
      transform: scale(0);
      animation: sin-water-drop 0.6s cubic-bezier(0.1, 0.7, 0.3, 1);
      pointer-events: none;
      top: 50%;
      left: 50%;
      margin-top: -50px;
      margin-left: -50px;
    }

    @keyframes sin-water-drop {
      to { transform: scale(3); opacity: 0; }
    }

    /* Action Buttons */
    .sin-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    .sin-btn {
      padding: 10px 24px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--sin-glass-bg);
      border: 1px solid var(--sin-primary);
      color: var(--sin-primary);
      backdrop-filter: blur(8px);
    }

    .sin-btn:hover {
      background: var(--sin-primary);
      color: #181a1f;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--sin-primary) 40%, transparent);
    }
  </style>
</head>
<body>

  <div class="sin-wave-view">
    <canvas class="sin-wave-canvas" id="waveCanvas"></canvas>

    <div class="sin-content">
      <div class="sin-tab-bar">
        <button class="sin-tab-btn sin-tab-btn--active">今日</button>
        <button class="sin-tab-btn">今後の予定</button>
        <button class="sin-tab-btn">サマリー</button>
      </div>

      <div class="sin-section">
        <div class="sin-date-nav">
          <span style="cursor:pointer; color: var(--text-muted)">◀</span>
          <span>2026/04/11 (土)</span>
          <span style="cursor:pointer; color: var(--text-muted)">▶</span>
        </div>

        <div class="sin-today-grid">
          <div>
            <div class="sin-subsection-title">習慣</div>
            <div class="sin-list" id="habitList">
              <div class="sin-item">
                <div class="sin-checkbox"><span class="sin-checkbox-check">✓</span></div>
                <span>🏃</span>
                <span class="sin-name">朝のランニング</span>
                <span class="sin-streak">🔥 12日連続</span>
              </div>
              <div class="sin-item sin-item--done">
                <div class="sin-checkbox"><span class="sin-checkbox-check">✓</span></div>
                <span>📖</span>
                <span class="sin-name">読書 30分</span>
                <span class="sin-streak">🔥 3日連続</span>
              </div>
              <div class="sin-item">
                <div class="sin-checkbox"><span class="sin-checkbox-check">✓</span></div>
                <span>🌱</span>
                <span class="sin-name">植物の水やり</span>
              </div>
            </div>
          </div>

          <div>
            <div class="sin-subsection-title">予定</div>
            <div class="sin-list">
              <div class="sin-item" style="cursor: default;">
                <span class="sin-time">14:30</span>
                <span>🦷</span>
                <span class="sin-name">歯医者 定期検診</span>
              </div>
              <div class="sin-item" style="cursor: default;">
                <span class="sin-time">19:00</span>
                <span>🍽️</span>
                <span class="sin-name">チーム夕食会</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="sin-actions">
        <button class="sin-btn">+ 習慣を追加</button>
        <button class="sin-btn">+ 予定を追加</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Checkbox Ripple Interaction
    // ============================================================
    document.querySelectorAll('.sin-item').forEach(item => {
      // 予定アイテムにはクリックイベントを付けない（デモ用）
      if (!item.querySelector('.sin-checkbox')) return;

      item.addEventListener('click', function(e) {
        // Toggle done class
        this.classList.toggle('sin-item--done');
        
        // 完了状態になった時だけ波紋を出す
        if (this.classList.contains('sin-item--done')) {
          const ripple = document.createElement('div');
          ripple.className = 'sin-ripple';
          this.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        }
      });
    });

    // ============================================================
    // Canvas Wave Animation (Neon & Fluid Layers)
    // ============================================================
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    let waveOffset = 0;

    // 波のパラメータ（奥のゆったりした波と、手前の小刻みな波）
    const WAVE_LAYERS = [
      { amplitude: 60, frequency: 0.008, speed: 0.003, opacity: 0.10, offset: 0 },
      { amplitude: 40, frequency: 0.015, speed: 0.006, opacity: 0.15, offset: 2 },
      { amplitude: 20, frequency: 0.025, speed: 0.010, opacity: 0.25, offset: 5 },
    ];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawWaves() {
      const { width, height } = canvas;
      ctx.clearRect(0, 0, width, height);

      // アクセントカラー (CSS変数から取得するか、フォールバック)
      const accentColor = '#4ECDC4'; 

      for (let i = 0; i < WAVE_LAYERS.length; i++) {
        const { amplitude, frequency, speed, opacity, offset } = WAVE_LAYERS[i];
        
        const scrollX = waveOffset * speed * 50;
        // 波の基準線を画面下部 60% 〜 80% 付近に配置
        const baseY = height * 0.7 + (i * 30); 

        ctx.beginPath();
        ctx.moveTo(0, height); 

        // 2px刻みで波を描画
        for (let x = 0; x <= width; x += 2) {
          const y = baseY + amplitude * Math.sin(frequency * (x + scrollX) + offset);
          ctx.lineTo(x, y);
        }

        ctx.lineTo(width, height);
        ctx.closePath();

        // 海のようなグラデーションの作成
        const gradient = ctx.createLinearGradient(0, baseY - amplitude * 2, 0, height);
        // color-mixがCanvas APIで使えないブラウザもあるため、rgbaで代用計算
        // #4ECDC4 = 78, 205, 196
        gradient.addColorStop(0, `rgba(78, 205, 196, ${opacity})`);
        gradient.addColorStop(1, `rgba(78, 205, 196, 0)`);

        ctx.fillStyle = gradient;
        ctx.fill();

        // 境界線をほのかに光らせる
        ctx.strokeStyle = `rgba(78, 205, 196, ${opacity * 2})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      waveOffset += 1;
      requestAnimationFrame(drawWaves);
    }

    drawWaves();
  </script>
</body>
</html>
